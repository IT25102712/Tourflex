<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col md:flex-row">

<div class="flex-1 flex items-center justify-center p-8 bg-surface relative z-10">
    <div class="w-full max-w-md bg-white p-10 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">
        <div class="text-center mb-8">
            <a th:href="@{/}" class="text-headline-md font-headline-md font-extrabold tracking-tight text-primary inline-block mb-2 no-underline hover:text-primary-container transition-colors">TOURFLEX</a>
            <h2 class="text-headline-sm font-headline-md text-on-background mt-2">Welcome Back</h2>
            <p class="text-body-md text-on-surface-variant mt-2">Log in to continue your journey.</p>
        </div>

        <!-- Success message (e.g. after registration) -->
        <div th:if="${message}" class="bg-primary/10 text-primary p-4 rounded-xl mb-6 text-sm font-label-md flex items-start gap-2">
            <span class="material-symbols-outlined text-sm mt-0.5">check_circle</span>
            <p th:text="${message}" class="m-0"></p>
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="bg-error-container text-on-error-container p-4 rounded-xl mb-6 text-sm font-label-md flex items-start gap-2">
            <span class="material-symbols-outlined text-sm mt-0.5">error</span>
            <p th:text="${error}" class="m-0"></p>
        </div>

        <form action="/user/login" method="post" onsubmit="return validateLogin()" class="flex flex-col gap-5">
            <div>
                <label for="email" class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Email Address</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
                    <input type="text" id="email" name="email" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" placeholder="you@example.com" required>
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
                    <input type="password" id="password" name="password" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3.5 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" placeholder="••••••••" required>
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
                        <span id="eyeIcon" class="material-symbols-outlined text-[20px]">visibility_off</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-md hover:bg-primary-container transition-all mt-4 shadow-md flex justify-center items-center gap-2 group">
                Sign In
                <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </button>
        </form>

        <div class="mt-8 text-center text-sm font-label-md text-on-surface-variant">
            Don't have an account? <a th:href="@{/user/register-page}" class="text-secondary-container hover:text-secondary transition-colors font-bold ml-1">Register</a>
        </div>
    </div>
</div>

<div class="hidden md:flex flex-1 relative overflow-hidden bg-primary">
    <img src="https://images.unsplash.com/photo-1546708973-14bc699ec1c7?auto=format&fit=crop&w=1200&q=80" alt="Beautiful Sri Lankan coast" class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-60">
    <div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/40 to-transparent"></div>
    <div class="absolute bottom-20 left-16 right-16">
        <div class="bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20">
            <h3 class="text-display-lg-mobile text-white font-bold mb-4 text-balance">Your journey begins here.</h3>
            <p class="text-white/80 text-body-lg text-balance">Access your bookings, custom itineraries, and exclusive island offers.</p>
        </div>
    </div>
</div>

<script>
    function validateLogin() {
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        if (!email || !password) {
            alert("Please fill in all fields.");
            return false;
        }
        return true;
    }

    function togglePassword() {
        let passwordField = document.getElementById("password");
        let eyeIcon = document.getElementById("eyeIcon");
        if (passwordField.type === "password") {
            passwordField.type = "text";
            eyeIcon.textContent = "visibility";
        } else {
            passwordField.type = "password";
            eyeIcon.textContent = "visibility_off";
        }
    }
</script>

</body>
</html>
