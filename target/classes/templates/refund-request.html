<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Request Refund - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Refund Request</h1>
        <p class="text-body-lg text-white/80">Please provide your bank details for the refund.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-12 w-full flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white p-8 md:p-12 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">

        <div class="bg-surface-container-low border border-outline-variant/30 rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 shadow-sm">
            <div>
                <div class="text-label-md text-outline uppercase tracking-widest font-bold">Booking</div>
                <div class="text-headline-sm text-primary font-bold" th:text="${booking.packageName}">Package Name</div>
                <div class="text-sm text-on-surface-variant font-medium mt-1" th:text="${booking.customerEmail}"></div>
            </div>
        </div>

        <form action="/refund/save" method="post" class="flex flex-col gap-5">
            <input type="hidden" name="bookingId" th:value="${booking.id}">
            <input type="hidden" name="customerName" th:value="${booking.customerName}">
            <input type="hidden" name="customerEmail" th:value="${booking.customerEmail}">
            <input type="hidden" name="packageName" th:value="${booking.packageName}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Bank Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">account_balance</span>
                        <input type="text" name="bankName" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="E.g. Commercial Bank">
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Account Holder Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
                        <input type="text" name="accountHolderName" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="John Doe">
                    </div>
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Account Number</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">123</span>
                        <input type="text" name="accountNumber" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all font-mono" required placeholder="0000000000">
                    </div>
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Branch Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">store</span>
                        <input type="text" name="branchName" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="Colombo 01">
                    </div>
                </div>
            </div>

            <div class="mt-2">
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Additional Notes</label>
                <textarea name="note" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all resize-none h-24" placeholder="Any extra information regarding this refund..."></textarea>
            </div>

            <div class="mt-6 flex flex-col sm:flex-row gap-4">
                <a th:href="@{/booking/my-bookings}" class="w-full sm:w-1/3 bg-surface-container-low text-on-surface-variant py-4 rounded-xl font-label-md hover:bg-surface-container-high transition-all text-center border border-outline-variant/30">
                    Cancel
                </a>
                <button type="submit" class="w-full sm:w-2/3 bg-secondary-container text-on-secondary-fixed py-4 rounded-xl font-label-md hover:bg-secondary-fixed transition-all shadow-md flex justify-center items-center gap-2">
                    Submit Request <span class="material-symbols-outlined text-[20px]">send</span>
                </button>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
