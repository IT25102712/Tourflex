<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Custom Packages')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Search Custom Packages</h1>
        <p class="text-body-lg text-white/80">Admin view to find packages by email.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-12 w-full">
    
    <div class="bg-white p-8 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20 mb-10">
        <form action="/custom-package/search" method="post" class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Customer Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
                    <input type="email" name="customerEmail" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="customer@example.com" required>
                </div>
            </div>
            <button type="submit" class="w-full md:w-auto bg-primary text-on-primary py-3 px-8 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md">
                Search
            </button>
        </form>
        <div th:if="${message}" class="mt-4 text-secondary-container font-bold text-center">
            <span th:text="${message}"></span>
        </div>
    </div>

    <div th:if="${packages != null}" class="bg-white rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-surface-container-low text-on-surface-variant text-label-md uppercase tracking-wider border-b border-outline-variant/30">
                        <th class="py-4 px-6 font-bold">ID</th>
                        <th class="py-4 px-6 font-bold">Location</th>
                        <th class="py-4 px-6 font-bold">Days</th>
                        <th class="py-4 px-6 font-bold">People</th>
                        <th class="py-4 px-6 font-bold">Type</th>
                        <th class="py-4 px-6 font-bold">Hotel</th>
                        <th class="py-4 px-6 font-bold">Transport</th>
                        <th class="py-4 px-6 font-bold">Total Price</th>
                        <th class="py-4 px-6 font-bold text-center">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-outline-variant/20">
                    <tr th:each="p : ${packages}" class="hover:bg-surface-container-lowest transition-colors">
                        <td class="py-4 px-6 text-sm font-semibold text-on-surface" th:text="${p.id}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${p.location}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${p.numberOfDays}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${p.numberOfPeople}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${p.packageType}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${p.hotelName}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${p.transportType}"></td>
                        <td class="py-4 px-6 text-sm font-bold text-primary" th:text="'Rs. ' + ${p.totalPrice}"></td>
                        <td class="py-4 px-6 text-center">
                            <a th:href="@{'/custom-package/delete/' + ${p.id} + '?email=' + ${searchedEmail}}"
                               onclick="return confirm('Delete this custom package?');" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-error-container text-on-error-container hover:bg-error-container/80 transition-colors">
                                <span class="material-symbols-outlined text-[18px]">delete</span>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
