<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Hotel - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: admin-navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Add New Hotel</h1>
        <p class="text-body-lg text-white/80">Add a new partner hotel to the database.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-12 w-full flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white p-8 md:p-12 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">

        <form action="/hotel/save" method="post" class="flex flex-col gap-5">
            <div>
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Hotel Name</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">hotel</span>
                    <input type="text" name="hotelName" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="Enter hotel name">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Location</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">location_on</span>
                        <select name="location" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required>
                            <option value="">Select Location</option>
                            <option value="Ella">Ella</option>
                            <option value="Kandy">Kandy</option>
                            <option value="Nuwara Eliya">Nuwara Eliya</option>
                            <option value="Yala">Yala</option>
                            <option value="Bentota">Bentota</option>
                            <option value="Galle">Galle</option>
                            <option value="Sigiriya">Sigiriya</option>
                            <option value="Trincomalee">Trincomalee</option>
                            <option value="Mirissa">Mirissa</option>
                            <option value="Colombo">Colombo</option>
                            <option value="Jaffna">Jaffna</option>
                            <option value="Anuradhapura">Anuradhapura</option>
                            <option value="Polonnaruwa">Polonnaruwa</option>
                            <option value="Dambulla">Dambulla</option>
                            <option value="Habarana">Habarana</option>
                            <option value="Pasikuda">Pasikuda</option>
                            <option value="Arugam Bay">Arugam Bay</option>
                            <option value="Hikkaduwa">Hikkaduwa</option>
                            <option value="Unawatuna">Unawatuna</option>
                            <option value="Weligama">Weligama</option>
                            <option value="Tangalle">Tangalle</option>
                            <option value="Negombo">Negombo</option>
                            <option value="Kalpitiya">Kalpitiya</option>
                            <option value="Kitulgala">Kitulgala</option>
                            <option value="Belihuloya">Belihuloya</option>
                            <option value="Horton Plains">Horton Plains</option>
                            <option value="Bandarawela">Bandarawela</option>
                            <option value="Badulla">Badulla</option>
                            <option value="Ratnapura">Ratnapura</option>
                            <option value="Sinharaja">Sinharaja</option>
                            <option value="Udawalawe">Udawalawe</option>
                            <option value="Minneriya">Minneriya</option>
                            <option value="Wilpattu">Wilpattu</option>
                            <option value="Pinnawala">Pinnawala</option>
                            <option value="Matara">Matara</option>
                            <option value="Batticaloa">Batticaloa</option>
                            <option value="Ampara">Ampara</option>
                            <option value="Kurunegala">Kurunegala</option>
                            <option value="Matale">Matale</option>
                            <option value="Mahiyanganaya">Mahiyanganaya</option>
                            <option value="Mannar">Mannar</option>
                            <option value="Vavuniya">Vavuniya</option>
                            <option value="Kilinochchi">Kilinochchi</option>
                            <option value="Mullaitivu">Mullaitivu</option>
                            <option value="Chilaw">Chilaw</option>
                            <option value="Puttalam">Puttalam</option>
                            <option value="Beruwala">Beruwala</option>
                            <option value="Aluthgama">Aluthgama</option>
                            <option value="Ahangama">Ahangama</option>
                            <option value="Tissamaharama">Tissamaharama</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Star Rating</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">star_rate</span>
                        <select name="starRating" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all text-primary font-semibold" required>
                            <option value="">Select Stars</option>
                            <option value="3 Star">⭐⭐⭐ 3 Star</option>
                            <option value="4 Star">⭐⭐⭐⭐ 4 Star</option>
                            <option value="5 Star">⭐⭐⭐⭐⭐ 5 Star</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <a th:href="@{/admin/dashboard}" class="w-full sm:w-1/3 bg-surface-container-low text-on-surface-variant py-4 rounded-xl font-label-md hover:bg-surface-container-high transition-all text-center border border-outline-variant/30">
                    Cancel
                </a>
                <button type="submit" class="w-full sm:w-2/3 bg-primary text-on-primary py-4 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">add_circle</span> Add Hotel
                </button>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
