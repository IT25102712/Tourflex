<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Packages - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: admin-navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Manage Packages</h1>
        <p class="text-body-lg text-white/80">View, edit, and delete tour itineraries.</p>
    </div>
</div>

<main class="flex-1 max-w-[1440px] mx-auto px-margin-desktop py-12 w-full">

    <div class="mb-6 flex justify-end">
        <a th:href="@{/packages/add-page}" class="bg-primary text-on-primary py-2 px-6 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md flex justify-center items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">add</span> Create Package
        </a>
    </div>

    <div th:if="${packages != null}" class="bg-white rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-surface-container-low text-on-surface-variant text-label-md uppercase tracking-wider border-b border-outline-variant/30">
                        <th class="py-4 px-6 font-bold w-16">ID</th>
                        <th class="py-4 px-6 font-bold">Package Name</th>
                        <th class="py-4 px-6 font-bold">Category</th>
                        <th class="py-4 px-6 font-bold">Type</th>
                        <th class="py-4 px-6 font-bold">Location</th>
                        <th class="py-4 px-6 font-bold">Duration</th>
                        <th class="py-4 px-6 font-bold">Price</th>
                        <th class="py-4 px-6 font-bold text-center">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-outline-variant/20">
                    <tr th:each="pkg : ${packages}" class="hover:bg-surface-container-lowest transition-colors group">
                        <td class="py-4 px-6 text-sm font-semibold text-on-surface" th:text="${pkg.id}"></td>
                        <td class="py-4 px-6 text-sm font-bold text-primary max-w-[200px] truncate" th:title="${pkg.name}" th:text="${pkg.name}"></td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider bg-surface-container-high text-on-surface" th:text="${pkg.category}"></span>
                        </td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant" th:text="${pkg.type}"></td>
                        <td class="py-4 px-6 text-sm font-medium text-on-surface" th:text="${pkg.location}"></td>
                        <td class="py-4 px-6 text-sm text-on-surface-variant"><span class="font-bold text-on-surface" th:text="${pkg.days}"></span> Days</td>
                        <td class="py-4 px-6 text-sm font-bold text-secondary-container tracking-wider whitespace-nowrap" th:text="'Rs. ' + ${pkg.price}"></td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <a th:href="@{'/packages/edit/' + ${pkg.id}}" class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-primary hover:text-white transition-colors shadow-sm" title="Edit">
                                    <span class="material-symbols-outlined text-[16px]">edit</span>
                                </a>
                                <a th:href="@{'/packages/delete/' + ${pkg.id}}" class="w-8 h-8 rounded-full bg-error-container text-on-error-container flex items-center justify-center hover:bg-error hover:text-white transition-colors shadow-sm" title="Delete" onclick="return confirm('Are you sure you want to delete this package?');">
                                    <span class="material-symbols-outlined text-[16px]">delete</span>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
