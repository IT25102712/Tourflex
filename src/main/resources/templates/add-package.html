<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Tour Package - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: admin-navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Add Tour Package</h1>
        <p class="text-body-lg text-white/80">Create a new curated itinerary for your customers.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-12 w-full flex items-center justify-center">
    <div class="w-full max-w-3xl bg-white p-8 md:p-12 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">

        <form action="/packages/add" method="post" enctype="multipart/form-data" class="flex flex-col gap-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Package Name</label>
                    <input type="text" name="name" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="E.g. Ultimate Ella Getaway">
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Category</label>
                    <select name="category" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required>
                        <option value="">Select Category</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Safari">Safari</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Holiday Relax">Holiday Relax</option>
                    </select>
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Type</label>
                    <select name="type" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required>
                        <option value="">Select Type</option>
                        <option value="Single">Single</option>
                        <option value="Couple">Couple</option>
                        <option value="Family">Family</option>
                        <option value="Group">Group</option>
                    </select>
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Location</label>
                    <input type="text" name="location" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="E.g. Ella">
                </div>
                
                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Base Price (LKR)</label>
                    <input type="number" step="0.01" name="price" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="0.00">
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Duration (Days)</label>
                    <input type="number" name="days" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required min="1" placeholder="1">
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Max People</label>
                    <input type="number" name="maxPeople" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required min="1" placeholder="2">
                </div>
            </div>

            <div class="border-t border-outline-variant/20 pt-6 grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Hotel Included</label>
                    <input type="text" name="hotelName" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="Hotel Name">
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Meals Included</label>
                    <input type="text" name="meals" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="E.g. Breakfast + Dinner">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Transport Methods</label>
                    <input type="text" name="transportMethods" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required placeholder="E.g. AC Car, Train">
                </div>
            </div>

            <div class="border-t border-outline-variant/20 pt-6">
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Description</label>
                <textarea name="description" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all resize-none h-32" required placeholder="Describe the tour package highlights..."></textarea>
            </div>

            <div class="border-t border-outline-variant/20 pt-6">
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Package Cover Image</label>
                <div class="w-full bg-surface-container-lowest border-2 border-dashed border-outline-variant/50 rounded-xl px-4 py-8 text-center hover:bg-surface-container-low transition-colors relative cursor-pointer">
                    <span id="add-pkg-icon" class="material-symbols-outlined text-[32px] text-outline mb-2 transition-colors">add_photo_alternate</span>
                    <div id="add-pkg-text" class="text-sm font-semibold text-primary">Click to browse or drag image here</div>
                    <input type="file" name="imageFile" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required onchange="if(this.files.length > 0) { document.getElementById('add-pkg-text').textContent = 'Selected: ' + this.files[0].name; document.getElementById('add-pkg-icon').textContent = 'image'; document.getElementById('add-pkg-icon').classList.add('text-secondary-container'); } else { document.getElementById('add-pkg-text').textContent = 'Click to browse or drag image here'; document.getElementById('add-pkg-icon').textContent = 'add_photo_alternate'; document.getElementById('add-pkg-icon').classList.remove('text-secondary-container'); }">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mt-4">
                <a th:href="@{/admin/dashboard}" class="w-full sm:w-1/3 bg-surface-container-low text-on-surface-variant py-4 rounded-xl font-label-md hover:bg-surface-container-high transition-all text-center border border-outline-variant/30">
                    Cancel
                </a>
                <button type="submit" class="w-full sm:w-2/3 bg-primary text-on-primary py-4 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">add_task</span> Add Package
                </button>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
