<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reviews - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: admin-navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Customer Reviews</h1>
        <p class="text-body-lg text-white/80">See what our travelers have to say about their adventures.</p>
    </div>
</div>

<main class="flex-1 max-w-[1000px] mx-auto px-margin-desktop py-12 w-full">

    <div class="mb-8 flex justify-end">
        <a th:href="@{/review/add-page}" class="bg-primary text-on-primary py-3 px-8 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px]">rate_review</span> Add Your Review
        </a>
    </div>

    <div th:if="${reviews == null or reviews.isEmpty()}" class="bg-white rounded-3xl p-12 text-center shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">
        <span class="material-symbols-outlined text-outline text-6xl mb-4 opacity-50">reviews</span>
        <h3 class="text-headline-sm text-on-surface mb-2">No reviews found</h3>
        <p class="text-body-md text-on-surface-variant">Be the first to share your experience!</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div th:each="review : ${reviews}" class="bg-white rounded-3xl p-6 md:p-8 shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20 transition-all hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] group relative overflow-hidden flex flex-col">
            
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-title-lg font-bold text-on-surface" th:text="${review.packageName}">Package Name</h3>
                <div class="flex items-center gap-1 text-secondary-container">
                    <span class="material-symbols-outlined text-[18px] filled" th:each="i : ${#numbers.sequence(1, review.rating)}">star</span>
                    <span class="material-symbols-outlined text-[18px] text-outline-variant" th:if="${review.rating < 5}" th:each="i : ${#numbers.sequence(review.rating + 1, 5)}">star</span>
                </div>
            </div>

            <p class="text-body-lg text-on-surface-variant leading-relaxed italic mb-6 flex-1">
                "<span th:text="${review.comment}"></span>"
            </p>

            <div class="flex items-center gap-3 pt-4 border-t border-outline-variant/20 mt-auto">
                <div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-lg">
                    <span th:text="${#strings.substring(review.customerName, 0, 1)}">A</span>
                </div>
                <div>
                    <div class="text-sm font-bold text-on-surface" th:text="${review.customerName}">Name</div>
                    <div class="text-[11px] text-on-surface-variant" th:text="${review.customerEmail}">Email</div>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
