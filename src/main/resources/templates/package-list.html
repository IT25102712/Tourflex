<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Packages - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Page Header -->
<div class="bg-primary text-white pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg mb-4">Discover Our Packages</h1>
        <p class="text-body-lg text-white/80 max-w-2xl mx-auto">Explore carefully curated tours across Sri Lanka designed for unforgettable experiences.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-16 w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        
        <div class="group bg-surface-container-lowest rounded-2xl overflow-hidden shadow-[0_8px_24px_rgba(0,0,0,0.08)] hover:-translate-y-2 transition-all duration-300 border border-outline-variant/20 flex flex-col" th:each="pkg : ${packages}">
            <div class="relative h-64 overflow-hidden">
                <img th:src="@{'/images/' + ${pkg.imageName}}"
                     th:alt="${pkg.location}"
                     class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">

                <div class="absolute top-4 right-4 bg-secondary-container text-on-secondary-fixed px-3 py-1 rounded-full text-xs font-bold shadow-md" th:text="'LKR ' + ${pkg.price}">
                    Rs. 0
                </div>
            </div>
            
            <div class="p-6 flex flex-col flex-1">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-headline-sm font-headline-sm text-primary" th:text="${pkg.name}">Package Name</h3>
                </div>
                
                <div class="flex flex-wrap gap-2 mb-4">
                    <span class="inline-flex items-center gap-1 bg-surface-container-high text-on-surface-variant px-2 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider">
                        <span class="material-symbols-outlined text-[14px]">location_on</span> <span th:text="${pkg.location}">Location</span>
                    </span>
                    <span class="inline-flex items-center gap-1 bg-surface-container-high text-on-surface-variant px-2 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider">
                        <span class="material-symbols-outlined text-[14px]">category</span> <span th:text="${pkg.category}">Category</span>
                    </span>
                </div>
                
                <div class="mt-auto pt-4 border-t border-outline-variant/20 flex items-center justify-between">
                    <span class="flex items-center gap-1 text-[13px] text-on-surface-variant font-semibold">
                        <span class="material-symbols-outlined text-sm">schedule</span> <span th:text="${pkg.days} + ' Days'">0 Days</span>
                    </span>
                </div>
                
                <div class="flex flex-col gap-2 mt-4">
                    <a th:href="@{'/packages/details/' + ${pkg.id}}" class="w-full text-center bg-surface-container-high text-on-surface py-2 rounded-lg font-label-md hover:bg-surface-container-highest transition-colors">
                        View Details
                    </a>
                    <a th:href="@{'/booking/book/' + ${pkg.id}}" class="w-full text-center bg-primary text-on-primary py-2 rounded-lg font-label-md hover:bg-primary-container transition-colors shadow-sm">
                        Book Now
                    </a>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
