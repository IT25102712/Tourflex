<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book Tour Package - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Book Your Adventure</h1>
        <p class="text-body-lg text-white/80">Complete the form below to secure your booking.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-12 w-full flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white p-8 md:p-12 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">

        <!-- Package summary card -->
        <div class="bg-surface-container-low border border-outline-variant/30 rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-sm">
            <div class="space-y-1">
                <div class="text-label-md text-outline uppercase tracking-widest font-bold">Package</div>
                <div class="text-headline-sm text-primary font-bold" th:text="${pkg.name}">Package Name</div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-on-surface-variant text-sm font-semibold mt-1">
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">location_on</span>
                        <span th:text="${pkg.location}">Location</span>
                    </span>
                    <span class="text-outline-variant">•</span>
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">schedule</span>
                        <span th:text="${pkg.days} + ' Days'">0 Days</span>
                    </span>
                    <span class="text-outline-variant">•</span>
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">group</span>
                        <span>Up to <span th:text="${pkg.maxPeople}">0</span> guests</span>
                    </span>
                </div>
            </div>
            <div class="text-right shrink-0">
                <div class="text-label-md text-outline uppercase tracking-widest font-bold mb-1">Package Price</div>
                <div class="text-2xl font-extrabold text-secondary-container" th:text="'Rs. ' + ${pkg.price}">Rs. 0</div>
            </div>
        </div>

        <form action="/booking/save" method="post" class="flex flex-col gap-5">
            <!-- Fixed hidden fields — no guest input needed for fixed packages -->
            <input type="hidden" name="packageName"   th:value="${pkg.name}">
            <input type="hidden" name="location"      th:value="${pkg.location}">
            <input type="hidden" name="totalPrice"    th:value="${pkg.price}">
            <input type="hidden" name="numberOfPeople" th:value="${pkg.maxPeople}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Full Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
                        <input type="text" name="customerName"
                               class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all"
                               th:value="${loggedInUser != null ? loggedInUser.name : ''}" required>
                    </div>
                </div>

                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
                        <input type="email" name="customerEmail"
                               class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all"
                               th:value="${loggedInUser != null ? loggedInUser.email : ''}" required>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Start Date</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">calendar_month</span>
                        <input type="date" name="bookingDate"
                               class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all"
                               required>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex flex-col sm:flex-row gap-4">
                <a th:href="@{'/packages/details/' + ${pkg.id}}"
                   class="w-full sm:w-1/3 bg-surface-container-low text-on-surface-variant py-4 rounded-xl font-label-md hover:bg-surface-container-high transition-all text-center border border-outline-variant/30">
                    Cancel
                </a>
                <button type="submit"
                        class="w-full sm:w-2/3 bg-primary text-on-primary py-4 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">check_circle</span> Confirm Booking
                </button>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var dateInput = document.querySelector('input[name="bookingDate"]');
        if (dateInput) {
            var today = new Date();
            // Add 3 days to current date to restrict booking for today + 48 hours
            today.setDate(today.getDate() + 3);
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            dateInput.min = yyyy + '-' + mm + '-' + dd;
        }
    });
</script>

</body>
</html>
