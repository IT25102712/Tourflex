<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payment Success - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bg-primary pt-24 pb-32">
    <!-- Background Header space for navbar -->
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop w-full -mt-24 mb-16 relative z-10 flex items-center justify-center">
    <div class="w-full max-w-xl bg-white p-8 md:p-12 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20 text-center">
        
        <div class="w-24 h-24 rounded-full bg-green-100 text-green-600 flex items-center justify-center mx-auto mb-6 shadow-md border-4 border-green-50">
            <span class="material-symbols-outlined text-[50px]">verified</span>
        </div>
        
        <h2 class="text-headline-md font-headline-md text-on-background mb-2">Payment Successful!</h2>
        <p class="text-body-md text-on-surface-variant mb-8">Thank you for your booking. Your adventure is confirmed and ready.</p>

        <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-6 text-left mb-8 shadow-sm">
            <h3 class="text-label-md text-outline uppercase tracking-widest font-bold mb-4 border-b border-outline-variant/30 pb-2">Receipt Details</h3>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-on-surface-variant font-medium">Name</span>
                    <span class="text-on-surface font-semibold" th:text="${payment.customerName}">Name</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-on-surface-variant font-medium">Email</span>
                    <span class="text-on-surface font-semibold" th:text="${payment.customerEmail}">Email</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-on-surface-variant font-medium">Status</span>
                    <span class="inline-flex items-center gap-1 bg-green-100 text-green-800 px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider">
                        <span th:text="${payment.paymentStatus}"></span>
                    </span>
                </div>
                
                <div class="pt-4 mt-4 border-t border-outline-variant/30 flex justify-between items-center">
                    <span class="text-on-surface font-bold">Amount Paid</span>
                    <span class="text-2xl font-extrabold text-primary" th:text="'Rs. ' + ${payment.amount}">Rs. 0</span>
                </div>
            </div>
        </div>

        <a th:href="@{/}" class="inline-block bg-primary text-on-primary px-8 py-4 rounded-xl font-label-md font-bold hover:bg-primary-container transition-all shadow-md group">
            Back to Home
        </a>
        
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
