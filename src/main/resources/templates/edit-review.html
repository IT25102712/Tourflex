<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Review - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bg-primary pt-32 pb-16 px-margin-mobile">
    <div class="max-w-[1280px] mx-auto text-center">
        <h1 class="text-display-lg-mobile font-display-lg md:text-display-lg text-white mb-4">Edit Your Review</h1>
        <p class="text-body-lg text-white/80">Update your feedback for this package.</p>
    </div>
</div>

<main class="flex-1 max-w-[1280px] mx-auto px-margin-desktop py-12 w-full flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white p-8 md:p-12 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">

        <form action="/review/update" method="post" class="flex flex-col gap-4">
            <input type="hidden" name="id" th:value="${review.id}">
            <input type="hidden" name="reviewDate" th:value="${review.reviewDate}">
            <input type="hidden" name="customerName" th:value="${review.customerName}">
            <input type="hidden" name="customerEmail" th:value="${review.customerEmail}">

            <div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant/30 mb-2 flex justify-between items-center">
                <div>
                    <div class="text-[12px] uppercase tracking-wider text-outline-variant font-bold mb-1">Reviewing Package</div>
                    <div class="font-bold text-primary" th:text="${review.packageName}">Package Name</div>
                    <input type="hidden" name="packageName" th:value="${review.packageName}">
                </div>
            </div>

            <div>
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Rating</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">star_rate</span>
                    <select name="rating" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all font-semibold text-primary" required>
                        <option value="5" th:selected="${review.rating == 5}">⭐⭐⭐⭐⭐ 5 - Excellent</option>
                        <option value="4" th:selected="${review.rating == 4}">⭐⭐⭐⭐ 4 - Very Good</option>
                        <option value="3" th:selected="${review.rating == 3}">⭐⭐⭐ 3 - Good</option>
                        <option value="2" th:selected="${review.rating == 2}">⭐⭐ 2 - Average</option>
                        <option value="1" th:selected="${review.rating == 1}">⭐ 1 - Poor</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Comment</label>
                <textarea name="comment" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all resize-none h-32" required th:text="${review.comment}"></textarea>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <a th:href="@{/review/add-page}" class="w-full sm:w-1/3 bg-surface-container-low text-on-surface-variant py-4 rounded-xl font-label-md hover:bg-surface-container-high transition-all text-center border border-outline-variant/30">
                    Cancel
                </a>
                <button type="submit" class="w-full sm:w-2/3 bg-primary text-on-primary py-4 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">save</span> Update Review
                </button>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
